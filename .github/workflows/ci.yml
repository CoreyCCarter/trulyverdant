name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Tests run against Postgres, not SQLite, so dialect differences
    # (timezone handling, ilike, constraint behaviour) surface here rather
    # than in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trulyverdant
          POSTGRES_PASSWORD: trulyverdant
          POSTGRES_DB: trulyverdant_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DATABASE_URL: postgresql://trulyverdant:trulyverdant@localhost:5432/trulyverdant_test
          TEST_DATABASE_URL: postgresql://trulyverdant:trulyverdant@localhost:5432/trulyverdant_test
        run: pytest -q

      - name: Verify migrations apply from scratch
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DATABASE_URL: postgresql://trulyverdant:trulyverdant@localhost:5432/trulyverdant_test
          FLASK_APP: tv.py
        run: |
          flask db upgrade
          flask db current

      - name: Check for a missing migration
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DATABASE_URL: postgresql://trulyverdant:trulyverdant@localhost:5432/trulyverdant_test
          FLASK_APP: tv.py
        run: |
          # Fails the build if models changed without a matching migration.
          flask db check
