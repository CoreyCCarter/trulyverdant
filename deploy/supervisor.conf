; TrulyVerdant -- supervisor program definition.
;
;   sudo cp deploy/supervisor.conf /etc/supervisor/conf.d/trulyverdant.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status trulyverdant
;
; __APP_DIR__ and __APP_USER__ are placeholders. install-services.sh fills
; them in from the checkout's real location and owner; edit them by hand if
; you install this file yourself.

[program:trulyverdant]
directory=__APP_DIR__
command=__APP_DIR__/venv/bin/gunicorn -c deploy/gunicorn.conf.py tv:app

user=__APP_USER__
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
; Give in-flight requests a chance to finish before SIGKILL.
stopwaitsecs=35
; Stop the whole process group, not just the master.
stopasgroup=true
killasgroup=true

; gunicorn binds a TCP address (see GUNICORN_BIND in .env), so there is no
; socket directory to create.
environment=PATH="__APP_DIR__/venv/bin:%(ENV_PATH)s",PYTHONUNBUFFERED="1"

stdout_logfile=/var/log/trulyverdant/gunicorn.log
stderr_logfile=/var/log/trulyverdant/gunicorn-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
