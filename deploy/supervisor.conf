; TrulyVerdant -- supervisor program definition.
;
;   sudo cp deploy/supervisor.conf /etc/supervisor/conf.d/trulyverdant.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status trulyverdant
;
; Adjust directory/user/paths to match the deployment.

[program:trulyverdant]
directory=/srv/trulyverdant
command=/srv/trulyverdant/venv/bin/gunicorn -c deploy/gunicorn.conf.py tv:app

user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
; Give in-flight requests a chance to finish before SIGKILL.
stopwaitsecs=35
; Stop the whole process group, not just the master.
stopasgroup=true
killasgroup=true

; The socket directory must exist and be writable by the same user.
; On a systemd host, prefer: /usr/lib/tmpfiles.d/trulyverdant.conf containing
;   d /run/trulyverdant 0755 www-data www-data -
; so it survives reboots. Otherwise create it in a pre-start step.
environment=PATH="/srv/trulyverdant/venv/bin:%(ENV_PATH)s",PYTHONUNBUFFERED="1"

stdout_logfile=/var/log/trulyverdant/gunicorn.log
stderr_logfile=/var/log/trulyverdant/gunicorn-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
