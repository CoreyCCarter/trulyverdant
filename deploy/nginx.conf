# TrulyVerdant -- nginx site config.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/trulyverdant
#   sudo ln -s /etc/nginx/sites-available/trulyverdant /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace SERVER_NAME_HERE and the paths, then run certbot for TLS.

upstream trulyverdant_app {
    # Matches `bind` in deploy/gunicorn.conf.py. Loopback only -- not
    # reachable from off the machine.
    server 127.0.0.1:8000 fail_timeout=0;
}

# Cache-bust static assets by filename or drop this map; a long max-age on
# mutable files means readers keep stale CSS after a deploy.
map $sent_http_content_type $static_cache {
    default                    "public, max-age=3600";
    ~image/                    "public, max-age=2592000";
    ~font/                     "public, max-age=2592000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    # certbot writes its challenge here; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAME_HERE;

    # certbot --nginx fills these in.
    # ssl_certificate     /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_HERE/privkey.pem;

    root /srv/trulyverdant;

    # Uploads are large; articles are not.
    client_max_body_size 12m;

    # Deliberately no Content-Security-Policy: AdSense injects scripts,
    # frames and images from a wide and changing set of Google hosts.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/xml image/svg+xml;

    # Static files are served by nginx directly; the app never sees them.
    location /static/ {
        alias /srv/trulyverdant/app/static/;
        access_log off;
        add_header Cache-Control $static_cache;
        try_files $uri =404;
    }

    # Uploaded media: long cache, and never execute anything from here.
    location /static/uploads/ {
        alias /srv/trulyverdant/app/static/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        location ~ \.(php|py|pl|sh|cgi)$ { deny all; }
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        proxy_pass http://trulyverdant_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
