# TrulyVerdant -- nginx config for the PUBLIC VPS.
#
# This file belongs on the VPS, not on the application server. The app runs
# elsewhere and is reached over a WireGuard tunnel:
#
#   browser --https--> VPS nginx --http over wg0--> gunicorn (app server)
#
# Install on the VPS:
#   sudo cp nginx-vps.conf /etc/nginx/sites-available/trulyverdant
#   sudo ln -s /etc/nginx/sites-available/trulyverdant /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d SERVER_NAME_HERE
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace SERVER_NAME_HERE and APP_WG_IP below.

upstream trulyverdant_app {
    # The application server's address ON THE WIREGUARD INTERFACE -- never
    # its LAN or public address. Must match `bind` in gunicorn.conf.py.
    server APP_WG_IP:8000 fail_timeout=0;

    # Reuse tunnel connections instead of a new TCP handshake per request;
    # over WireGuard that handshake is the expensive part.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAME_HERE;

    # certbot --nginx fills these in.
    # ssl_certificate     /etc/letsencrypt/live/SERVER_NAME_HERE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME_HERE/privkey.pem;

    # Article images. Must be at least MAX_UPLOAD_MB in the app's config.
    client_max_body_size 12m;

    # Deliberately no Content-Security-Policy: AdSense injects scripts,
    # frames and images from a wide and changing set of Google hosts.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/xml image/svg+xml;

    # Everything, including /static/, is proxied to the app server: nginx is
    # on a different machine and cannot read the app's disk. Assets therefore
    # cross the tunnel and occupy a gunicorn thread on every request. If page
    # loads get slow once there are real images, add a proxy_cache here --
    # see the note in the README.
    location / {
        proxy_pass http://trulyverdant_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # required for keepalive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;

        # The tunnel can be slow to establish but should not hang forever.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # If the tunnel is down, say so honestly rather than showing a raw 502.
    error_page 502 504 /_offline.html;
    location = /_offline.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Temporarily unavailable</title><style>body{font:16px system-ui;max-width:32rem;margin:20vh auto;padding:0 1.5rem;color:#1c2118}</style><h1>Temporarily unavailable</h1><p>The site is briefly offline. Please try again in a moment.</p>';
    }
}
